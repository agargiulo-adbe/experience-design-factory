<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Il segno è lo STESSO che regge il deck: tre fasce, e quella di mezzo è
       l'unica che cambia. Geometria, non una lettera: a 16px un glifo sembra
       un carattere non caricato. E non il logo del cliente, che vive nel
       co-brand. Chi ha visto il documento riconosce la forma. -->
  <rect width="32" height="32" rx="7" fill="#002023"/>
  <rect x="6" y="7"  width="20" height="4.6" rx="1.6" fill="#ffffff" opacity="0.42"/>
  <rect x="6" y="13.7" width="20" height="4.6" rx="1.6" fill="#00b97f"/>
  <rect x="6" y="20.4" width="20" height="4.6" rx="1.6" fill="#ffffff" opacity="0.42"/>
</svg>

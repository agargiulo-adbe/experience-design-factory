<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Su scala umana">
  <!-- «Su scala umana»: la pila dell'innesto, che è il disegno su cui regge
       tutto il deck. In basso lo strato del cliente, pieno e nel suo verde di
       sistema; sopra i due che si appoggiano, in contorno. Geometria, non un
       glifo: a 16px una lettera sembrerebbe un carattere non caricato.
       Verdi letti dal CSS di produzione di intesasanpaolo.com. -->
  <rect width="32" height="32" rx="7" fill="#0d2901"/>
  <g fill="none" stroke="#4fc21f" stroke-width="2">
    <rect x="7" y="7.5" width="18" height="5.5" rx="1"/>
    <rect x="7" y="15.25" width="18" height="5.5" rx="1"/>
  </g>
  <rect x="7" y="23" width="18" height="5.5" rx="1" fill="#258900"/>
</svg>

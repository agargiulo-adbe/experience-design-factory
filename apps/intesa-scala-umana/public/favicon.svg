<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Su scala umana">
  <!-- «Su scala umana»: una scala che sale, e la base su cui poggia.
       Il titolo dà l'immagine e il deck le dà il senso — la fondazione è del
       cliente (la barra piena, nel suo verde di sistema) e i gradini salgono
       sopra senza coprirla. Una forma sola, non tre barre: a 16px un gruppo
       di barre diventa un grafichetto qualunque, un profilo a gradini resta
       riconoscibile. Niente lettere: a quella dimensione un glifo sembra un
       carattere che non ha caricato. Verdi letti dal CSS di produzione di
       intesasanpaolo.com. -->
  <rect width="32" height="32" rx="7" fill="#0d2901"/>
  <path d="M7 22.5 V17.5 H13.5 V12 H20 V6.5 H25.5"
        fill="none" stroke="#4fc21f" stroke-width="2.6"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="6" y="24.5" width="20" height="3" rx="1.5" fill="#258900"/>
</svg>

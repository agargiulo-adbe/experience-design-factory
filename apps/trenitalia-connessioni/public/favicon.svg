<!-- Tre binari su fondo ardesia: la forma geometrica che regge il deck, non una
     lettera (a 16px un glifo sembra un carattere non caricato) e non il logo del
     cliente (quello vive nel co-brand). Il fondo è il primary-blu letto dal CSS
     di produzione di trenitalia.com; la linea accesa è il rosso del sito. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#2f394e"/>
  <rect x="6" y="10" width="20" height="2" rx="1" fill="#f1f3f4" opacity="0.55"/>
  <rect x="6" y="15" width="20" height="2" rx="1" fill="#d91835"/>
  <rect x="6" y="20" width="20" height="2" rx="1" fill="#f1f3f4" opacity="0.55"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sei domande">
  <!-- «Sei domande»: la faccia del sei, due colonne per tre. L'ultimo punto è giallo
       perché nel deck il giallo è la risposta. Geometria, non un glifo: a 16px non
       può sembrare un carattere che non ha caricato. -->
  <rect width="32" height="32" rx="7" fill="#0047bb"/>
  <g fill="#ffffff">
    <circle cx="11" cy="8.6" r="3.4"/>
    <circle cx="21" cy="8.6" r="3.4"/>
    <circle cx="11" cy="16" r="3.4"/>
    <circle cx="21" cy="16" r="3.4"/>
    <circle cx="11" cy="23.4" r="3.4"/>
  </g>
  <circle cx="21" cy="23.4" r="3.4" fill="#eedc00"/>
</svg>

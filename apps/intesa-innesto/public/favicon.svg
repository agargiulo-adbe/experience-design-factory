<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- «Dove ci innestiamo» — il marchio è l'INNESTO, cioè il disegno che regge
       il deck ridotto a geometria: un percorso che corre, e un tratto che vi si
       innesta dall'alto chiudendosi in un nodo. Nessuna lettera (a 16px un
       glifo sembra un carattere non caricato) e nessun logo del cliente, che
       vive nel co-brand. Verde di sistema del cliente, letto dal suo CSS. -->
  <rect width="32" height="32" rx="7" fill="#258900"/>
  <path d="M4.8 21.6 H27.2" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M19.2 7.4 V18.4" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="19.2" cy="21.6" r="3.2" fill="#ffffff"/>
</svg>

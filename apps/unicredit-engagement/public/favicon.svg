<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Engagement Unlimited">
  <!-- «Engagement Unlimited»: un giro che non si interrompe, con il punto che
       continua a muovercisi sopra. Geometria, non le iniziali: a 16px due
       lettere sembrano un carattere che non ha caricato, e le iniziali del
       cliente non sono un marchio nostro da comporre.
       Colori dal design system vero di unicredit.it: il petrolio è il colore
       di SISTEMA (271 occorrenze nel CSS di produzione), il ciano il suo
       accento, il petrolio notte la superficie scura del deck. Il rosso è il
       marchio e qui non entra: in un'icona starebbe al posto del logo. -->
  <rect width="32" height="32" rx="7" fill="#04252D"/>
  <circle cx="16" cy="16" r="9" fill="none" stroke="#007A91" stroke-width="3.4"/>
  <circle cx="22.4" cy="9.6" r="3.4" fill="#00AED0"/>
</svg>

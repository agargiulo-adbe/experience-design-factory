<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- «Dove può arrivare il viaggio» — la forma che regge il deck: la linea con le
       fermate. Geometrica, non una lettera (a 16px un glifo sembra un carattere non
       caricato) e non il marchio del cliente (quello vive nel co-brand).
       Fondo ardesia notte #1b2230 e fermata accesa in rosso #d91835: i due colori
       letti dal CSS di produzione di trenitalia.com. -->
  <rect width="32" height="32" rx="7" fill="#1b2230"/>
  <path d="M6 16h20" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <circle cx="7.5" cy="16" r="2.6" fill="#ffffff" fill-opacity="0.75"/>
  <circle cx="16" cy="16" r="4.6" fill="#d91835"/>
  <circle cx="24.5" cy="16" r="2.6" fill="#ffffff" fill-opacity="0.75"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Alfabeti">
  <!-- «Alfabeti»: due alfabeti che si sovrappongono — quello che la scuola ha
       già e quello digitale — con il terreno in comune nel mezzo. Geometria,
       non una lettera: su questo account l'immagine non deve mai essere un
       glifo, e il file che stava qui era per giunta copiato da un'altra
       experience, gold su nero, fuori dall'identità blu Italia.
       Blu Italia #0066CC e blu notte #0A1A33, i token della skin. -->
  <rect width="32" height="32" rx="7" fill="#0A1A33"/>
  <rect x="5.5" y="5.5" width="14" height="14" rx="3" fill="#0066CC"/>
  <rect x="12.5" y="12.5" width="14" height="14" rx="3" fill="none" stroke="#F4F6F9" stroke-width="2.2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pole Position">
  <!-- «Pole Position»: la griglia di partenza vista dall'alto, con la prima
       piazzola occupata. Geometria presa dal deck, non il marchio del cliente:
       il Cavallino non si ridisegna (il marchio del cliente vive nel co-brand,
       e un logo ricostruito a mano è esattamente la wrong-brand imagery che la
       Quality Bar vieta). Rosso Corsa sul carbonio del deck. -->
  <rect width="32" height="32" rx="7" fill="#0B0B0D"/>
  <rect x="5" y="6" width="11" height="5" rx="1.4" fill="#FF2800"/>
  <rect x="17" y="13.5" width="10" height="5" rx="1.4" fill="#45454A"/>
  <rect x="5" y="21" width="10" height="5" rx="1.4" fill="#45454A"/>
</svg>

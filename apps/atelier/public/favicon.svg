<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Experience Atelier">
  <!-- «Experience Atelier»: le tre mosse su cui è costruito il deck, in
       crescita. Geometria, non la «A»: a 16px un glifo sembra un carattere che
       non ha caricato — e quella «A» era lo stesso identico file del marchio
       di un'altra experience, cioè due deck con la stessa icona nella barra
       delle schede. L'ultima mossa è in avorio: è quella da decidere. -->
  <rect width="32" height="32" rx="7" fill="#12100C"/>
  <rect x="6.5" y="18" width="5.5" height="8" rx="1.4" fill="#9A7B45"/>
  <rect x="13.5" y="13" width="5.5" height="13" rx="1.4" fill="#C9A96A"/>
  <rect x="20.5" y="7" width="5.5" height="19" rx="1.4" fill="#F4EFE4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Generazioni">
  <!-- «Generazioni»: anelli concentrici, come quelli di un tronco — una
       generazione dentro l'altra, ed è il tema del deck. Geometria, non la
       «G»: a 16px un glifo sembra un carattere che non ha caricato.
       Cammello e testa-di-moro, i due colori su cui regge la skin. -->
  <rect width="32" height="32" rx="7" fill="#3E2C20"/>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#C19A6B" stroke-width="2.4"/>
  <circle cx="16" cy="16" r="4.4" fill="#C19A6B"/>
</svg>

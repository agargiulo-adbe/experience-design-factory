<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Adobe × Intesa Sanpaolo.

    Una cosa sola, vista da due parti: un cerchio tagliato da un canale
    verticale, la metà sinistra PIENA — quello che vede la cliente, che è
    tutto quello che c'è per lei — e la destra di CONTORNO, quello che vede
    chi prepara e che lei non vede mai.

    Niente lettere (a 16px un glifo sembra un carattere non caricato) e
    niente logo del cliente (quello vive nel co-brand). Solo geometria,
    quindi regge a 16px come a 512.
  -->
  <rect width="32" height="32" rx="7" fill="#258900"/>
  <!-- metà sinistra, piena: il lato della cliente -->
  <path d="M15.1 6.9a9.1 9.1 0 0 0 0 18.2z" fill="#ffffff"/>
  <!-- metà destra, di contorno: il lato di chi prepara -->
  <path d="M16.9 6.9a9.1 9.1 0 0 1 0 18.2" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
</svg>

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Primo, non ultimo: è un gate di riservatezza su un repo PUBBLICO e
      # costa secondi. Se sotto docs/ è finito materiale di un cliente, il
      # giro deve rompersi subito, non dopo cinque minuti di build.
      - name: docs/ non contiene materiale di cliente
        run: pnpm audit:docs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      - run: npx tsx scripts/content-audit.ts
